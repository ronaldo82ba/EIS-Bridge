name: Frontend Build

on:
  push:
    branches: [main, master, 'release/**']
  pull_request:
    branches: [main, master, 'release/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build admin frontend
        run: npm run build

      - name: Assert admin Vite manifest entries
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const manifest = JSON.parse(fs.readFileSync("public/build/manifest.json", "utf8"));
            for (const entry of ["resources/css/admin.css", "resources/js/admin/main.jsx"]) {
              if (!manifest[entry]?.file) {
                console.error("Vite manifest missing " + entry);
                process.exit(1);
              }
            }
            console.log(manifest["resources/js/admin/main.jsx"].file);
          '
